<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <title>MuseumGuessr — Made here. Kept there.</title>
  <desc>Human-headed winged lion (lamassu), made in Nimrud and kept in New York.</desc>
  <rect width="1200" height="630" fill="{{color.bg}}"/>
  <path d="M0 0h1200v10H0z" fill="{{color.accent}}"/>
  <g transform="translate(44 30)">
    <path d="{{made}}" transform="scale(.8)" fill="{{color.made}}"/>
    <path d="M30 16h10" stroke="{{color.answer-line}}" stroke-width="2"/>
    <path d="{{kept}}" transform="translate(42 0) scale(.8)" fill="{{color.kept}}"/>
    <text x="84" y="29" font-family="Barlow Condensed" font-size="36" font-weight="700" fill="{{color.ink}}">MuseumGuessr</text>
  </g>
  <text x="44" y="115" font-family="IBM Plex Mono" font-size="15" fill="{{color.ink-muted}}" letter-spacing="2">AN OBJECT. TWO PLACES. ONE DATE.</text>
  <g font-family="Barlow Condensed" font-size="100" font-weight="700">
    <text x="40" y="218" fill="{{color.ink}}">Made here.</text>
    <text x="40" y="311" fill="{{color.accent}}">Kept there.</text>
  </g>
  <rect x="610" y="30" width="546" height="491" fill="{{color.matte}}"/>
  <image x="628" y="42" width="510" height="453" preserveAspectRatio="xMidYMid meet" xlink:href="{{photo}}"/>
  <rect x="626" y="46" width="118" height="30" fill="{{color.surface}}"/>
  <text x="638" y="67" font-family="IBM Plex Mono" font-size="15" fill="{{color.ink}}">OBJECT 00</text>
  <text x="610" y="551" font-family="IBM Plex Sans" font-size="20" font-weight="500" fill="{{color.ink}}">Human-headed winged lion (lamassu)</text>
  <text x="610" y="578" font-family="IBM Plex Mono" font-size="15" fill="{{color.ink-muted}}">ca. 883–859 BCE</text>
  <text x="610" y="606" font-family="IBM Plex Sans" font-size="15" fill="{{color.ink-muted}}">Photo: The Metropolitan Museum of Art, CC0 1.0</text>
  <svg x="44" y="338" width="510" height="196" viewBox="35 8 220 85">
    <rect x="35" y="8" width="220" height="85" fill="{{map.water}}"/>
    <path d="{{world}}" fill="{{map.land}}"/>
    <path d="M{{madePoint}} Q146 10 {{keptPoint}}" fill="none" stroke="{{color.answer-line}}" stroke-width="1.8"/>
    <path d="{{made}}" transform="translate({{madeAnchor}}) scale(.55)" fill="{{color.made}}" stroke="{{map.land}}" stroke-width="1.5"/>
    <path d="{{kept}}" transform="translate({{keptAnchor}}) scale(.55)" fill="{{color.kept}}" stroke="{{map.land}}" stroke-width="1.5"/>
  </svg>
  <g font-family="IBM Plex Mono" font-size="14" fill="{{color.ink-muted}}">
    <text x="44" y="562">MADE</text><text x="335" y="562">KEPT TODAY</text>
  </g>
  <g font-family="IBM Plex Sans" font-size="26" font-weight="500" fill="{{color.ink}}">
    <text x="44" y="596">Nimrud</text><text x="335" y="596">New York</text>
  </g>
  <path d="M172 586h133m-8-6 8 6-8 6" fill="none" stroke="{{color.answer-line}}" stroke-width="2"/>
</svg>
