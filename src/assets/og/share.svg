<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <title>MuseumGuessr — Made here. Kept there. Guess both.</title>
  <desc>Human-headed winged lion (lamassu), made in Nimrud and kept in New York.</desc>
  <rect width="1200" height="630" fill="{{color.bg}}"/>
  <g transform="translate(44 36)">
    <rect width="52" height="52" rx="13" fill="{{color.accent}}"/>
    <path d="{{kept}}" fill-rule="evenodd" transform="translate(10 6)" fill="{{color.accent-ink}}"/>
    <text x="68" y="38" font-family="Bricolage Grotesque" font-size="38" font-weight="800" letter-spacing="-1" fill="{{color.ink}}">Museum<tspan fill="{{color.accent}}">Guessr</tspan></text>
  </g>
  <text x="44" y="146" font-family="Instrument Sans" font-size="17" font-weight="600" letter-spacing="2.4" fill="{{color.ink-muted}}">ONE OBJECT. THREE QUESTIONS.</text>
  <g font-family="Bricolage Grotesque" font-size="74" font-weight="800" letter-spacing="-2.4">
    <text x="42" y="222" fill="{{color.ink}}">Made here.</text>
    <text x="42" y="300" fill="{{color.ink}}">Kept there.</text>
    <rect x="34" y="318" width="430" height="86" rx="12" fill="{{color.accent}}"/>
    <text x="48" y="384" fill="{{color.accent-ink}}">Guess both.</text>
  </g>
  <rect x="620" y="36" width="536" height="474" rx="16" fill="{{color.matte}}"/>
  <image x="636" y="52" width="504" height="442" preserveAspectRatio="xMidYMid meet" xlink:href="{{photo}}"/>
  <rect x="640" y="62" width="104" height="32" rx="16" fill="{{color.ink}}"/>
  <text x="692" y="84" text-anchor="middle" font-family="Instrument Sans" font-size="16" font-weight="600" fill="{{color.ink-inverse}}">Example</text>
  <text x="620" y="546" font-family="Instrument Sans" font-size="22" font-weight="600" fill="{{color.ink}}">Human-headed winged lion (lamassu)</text>
  <text x="620" y="575" font-family="Instrument Sans" font-size="17" fill="{{color.ink-muted}}">ca. 883–859 BCE</text>
  <text x="620" y="603" font-family="Instrument Sans" font-size="15" fill="{{color.ink-muted}}">Photo: The Metropolitan Museum of Art, CC0 1.0</text>
  <svg x="44" y="426" width="356" height="138" viewBox="35 8 220 85">
    <rect x="35" y="8" width="220" height="85" rx="6" fill="{{map.water}}"/>
    <path d="{{world}}" fill="{{map.land}}"/>
    <path d="M{{madePoint}} Q146 10 {{keptPoint}}" fill="none" stroke="{{color.answer-line}}" stroke-width="1.8"/>
    <path d="{{made}}" fill-rule="evenodd" transform="translate({{madeAnchor}}) scale(.55)" fill="{{color.made}}" stroke="{{map.land}}" stroke-width="1.5"/>
    <path d="{{kept}}" fill-rule="evenodd" transform="translate({{keptAnchor}}) scale(.55)" fill="{{color.kept}}" stroke="{{map.land}}" stroke-width="1.5"/>
  </svg>
  <g font-family="Instrument Sans" font-size="13" font-weight="600" letter-spacing="1.6" fill="{{color.ink-muted}}">
    <text x="420" y="462">MADE</text><text x="420" y="526">KEPT TODAY</text>
  </g>
  <g font-family="Instrument Sans" font-size="24" font-weight="600" fill="{{color.ink}}">
    <text x="420" y="490">Nimrud</text><text x="420" y="554">New York</text>
  </g>
</svg>
